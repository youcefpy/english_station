# setup.cfg
[coverage:run]
source = app_english
omit = 
    */migrations/*
    */tests/*
    manage.py
    */settings.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod

precision = 2

[coverage:html]
directory = htmlcov