{% extends "base.html" %}

{% block title %}Choose a semester{% endblock %}

{% block content %}
<main class="container py-4 py-lg-5">
    <h1 class="h2 mb-2">Choose a semester</h1>
    <p class="text-muted mb-4">{{ stream.get_name_display }}</p>
    <div class="d-flex flex-wrap gap-3">
        {% for semester_value, semester_label in semesters %}
            <a class="btn btn-outline-primary" href="{% url 'units_by_semester' stream.id semester_value %}">
                {{ semester_label }}
            </a>
        {% endfor %}
    </div>
</main>
{% endblock %}
